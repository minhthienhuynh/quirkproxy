name: ci
on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - '.dockerignore'
      - 'config*.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make vet
      - run: make fmt
      - run: make test
      - run: make race

  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    needs: gates
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-dokploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    permissions: {}
    steps:
      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
        run: |
          : "${DOKPLOY_URL:?missing DOKPLOY_URL secret}"
          : "${DOKPLOY_API_KEY:?missing DOKPLOY_API_KEY secret}"
          : "${DOKPLOY_COMPOSE_ID:?missing DOKPLOY_COMPOSE_ID secret}"
          base="${DOKPLOY_URL%/}"
          payload="{\"composeId\":\"$DOKPLOY_COMPOSE_ID\"}"
          body_file=$(mktemp)
          code=$(curl -sS --max-time 30 -o "$body_file" -w '%{http_code}' -X POST \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'Content-Type: application/json' \
            "$base/api/compose.redeploy" \
            -d "$payload") || true
          echo "compose.redeploy -> HTTP $code"
          cat "$body_file"; echo
          rm -f "$body_file"
          case "$code" in
            2*) echo 'Dokploy redeploy triggered' ;;
            401|403) echo 'ERROR: Unauthorized/Forbidden — check DOKPLOY_API_KEY secret and its access to the compose'; exit 1 ;;
            404) echo 'ERROR: Not found — check DOKPLOY_URL (panel base URL, no /api suffix) and DOKPLOY_COMPOSE_ID secret'; exit 1 ;;
            000) echo 'ERROR: Could not reach Dokploy — check DOKPLOY_URL is a public URL (not localhost/LAN)'; exit 1 ;;
            *) echo 'ERROR: Trigger failed'; exit 1 ;;
          esac
